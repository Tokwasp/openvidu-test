# ── 앱(프론트 + /api) 리버스 프록시 ─────────────────────────────
# 호스트 nginx 가 TLS 를 종료하고, 프론트 컨테이너(127.0.0.1:8081)로 넘긴다.
# 프론트 컨테이너의 nginx 가 다시 /api 를 backend:8080 으로 넘기므로
# 여기서는 전부 8081 로 보내면 된다.
#
# 이 파일은 80(HTTP) 블록만 있다. `sudo certbot --nginx` 를 돌리면
# certbot 이 443/SSL 블록과 80→443 리다이렉트를 이 파일에 자동으로 추가한다.
#
# 사용 전 example.com 을 실제 도메인으로 바꾼다:
#   sudo sed -i 's/example\.com/실제도메인/g' /etc/nginx/sites-available/app.conf

server {
    listen 80;
    listen [::]:80;
    server_name example.com;

    # 녹음/업로드 등 큰 응답 대비 (필요 없으면 줄여도 됨)
    client_max_body_size 20m;

    location / {
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
