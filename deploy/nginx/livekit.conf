# ── LiveKit(OpenVidu3) wss 시그널링 리버스 프록시 ────────────────
# 브라우저는 HTTPS 페이지에서 ws:// 로 붙을 수 없다(혼합 콘텐츠 차단).
# 그래서 시그널링(7880)을 nginx 로 감싸 wss 로 노출한다.
#
# ⚠️ 여기로는 "시그널링"만 지나간다. 실제 오디오/비디오 미디어는
#    UDP 50000-50060 / TCP 7881 로 브라우저와 EC2 가 직접 주고받는다.
#    → 이 포트들은 nginx 가 아니라 UFW 에서 열어야 한다(setup-firewall.sh).
#
# certbot --nginx 가 443/SSL 을 자동 추가한다.
# 사용 전 도메인 치환:
#   sudo sed -i 's/livekit\.example\.com/실제livekit도메인/g' \
#       /etc/nginx/sites-available/livekit.conf

server {
    listen 80;
    listen [::]:80;
    server_name livekit.example.com;

    location / {
        proxy_pass http://127.0.0.1:7880;

        # WebSocket 업그레이드 (시그널링에 필수)
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 회의가 길어져도 시그널링 연결이 끊기지 않도록 타임아웃을 넉넉히
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}
