# ── 단일 도메인 변형 ─────────────────────────────────────────────
# 서브도메인(livekit.example.com)을 못 만들 때 쓴다.
# 하나의 도메인에서 앱과 LiveKit 시그널링을 경로로 나눈다.
#   - /rtc      → LiveKit 시그널링(7880)  (livekit-client 가 붙는 경로)
#   - 그 외 /   → 프론트 컨테이너(8081)
#
# 이 방식을 쓰면 .env 는:
#   LIVEKIT_WS_URL=wss://example.com      (경로 /rtc 없이 호스트만)
# livekit-client 가 알아서 /rtc 를 붙인다.
#
# app.conf 와 livekit.conf 대신 "이 파일 하나만" 심는다.
# certbot --nginx 가 443/SSL 을 자동 추가한다.
# 사용 전: sudo sed -i 's/example\.com/실제도메인/g' \
#             /etc/nginx/sites-available/app-single-domain.conf

server {
    listen 80;
    listen [::]:80;
    server_name example.com;

    client_max_body_size 20m;

    # LiveKit 시그널링(WebSocket). /rtc, /rtc/validate 가 모두 여기로 온다.
    location /rtc {
        proxy_pass http://127.0.0.1:7880;

        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # 앱(프론트 + /api). 프론트 컨테이너 nginx 가 /api 를 backend 로 넘긴다.
    location / {
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
