server:
  port: 8080

spring:
  application:
    name: meeting

  # ── 세션(모놀리식과 공유하는 Upstash Redis) — 02 §7 ──────────────
  # 회의 서비스는 이 Redis 세션에서 LoginMember 를 읽어 회원을 식별한다.
  # ⚠️ 모놀리식과 같은 Upstash·같은 SESSION 쿠키·같은 직렬화여야 한다(SessionConfig).
  data:
    redis:
      host: ${UPSTASH_REDIS_HOST}
      port: ${UPSTASH_REDIS_PORT:6379}
      password: ${UPSTASH_REDIS_PASSWORD}
      ssl:
        enabled: ${UPSTASH_REDIS_SSL:true}
  session:
    store-type: redis
    timeout: 30m
    redis:
      namespace: ${SESSION_NAMESPACE:spring:session}   # 모놀리식이 커스텀했으면 맞춘다

# ── 회의 서비스 옵션 ──────────────────────────────────────────
meeting:
  # true 면 세션 없이도 쿼리 memberId 로 참여(개발/단독 테스트용). 운영에선 반드시 false.
  # 지금은 세션 공유(도메인) 문제로 테스트가 막혀 임시로 기본 true. 운영 배포 전 false 로 되돌릴 것.
  dev-auth-bypass: ${MEETING_DEV_AUTH_BYPASS:true}

# ── LiveKit(OpenVidu3) 접속 정보 ──────────────────────────────
livekit:
  # 브라우저가 WebRTC로 붙는 주소 (프론트에 그대로 내려줌)
  ws-url: ${LIVEKIT_WS_URL:ws://localhost:7880}
  # 백엔드→LiveKit REST(Room/Egress) 호출 주소 (도커 내부 네트워크)
  host: ${LIVEKIT_HOST:http://livekit:7880}
  api-key: ${LIVEKIT_API_KEY:devkey}
  api-secret: ${LIVEKIT_API_SECRET:secretsecretsecretsecret}
  # 토큰 유효시간(ms) — 02-access-token.md §5: 입장까지 10분
  token-ttl-ms: 600000
  # 회의방 타임아웃 — 01-room-lifecycle.md §4
  empty-timeout-sec: 120
  # 마지막 한 명이 나가면 거의 즉시 방을 닫아 mixed 녹음을 바로 마감한다.
  # 0 은 "기본값 사용"으로 해석돼 livekit.yaml 의 20 으로 폴백되므로 최소값 1 을 쓴다.
  # (재접속 유예가 사실상 사라져, 순간 끊김 뒤 재입장은 새 방으로 분리된다.)
  departure-timeout-sec: 1

# ── 녹음 저장: 우리 AWS S3 (docs §8) — Egress 가 요청마다 직접 업로드 ──
aws:
  s3:
    bucket: ${AWS_S3_BUCKET}
    region: ${AWS_S3_REGION:ap-northeast-2}
    access-key: ${AWS_S3_ACCESS_KEY}
    secret-key: ${AWS_S3_SECRET_KEY}
  # egress_ended → 큐로 후처리 메시지 발행 (비우면 발행 생략)
  # queue-url = 단체(MIXED) 믹스 큐, personal-queue-url = 개인(PARTICIPANT) 음성 큐
  # personal-queue-url 을 비우면 개인 녹음도 단체 큐로 발행한다(하위 호환).
  sqs:
    queue-url: ${AWS_SQS_QUEUE_URL:}
    personal-queue-url: ${AWS_SQS_PERSONAL_QUEUE_URL:}

logging:
  level:
    com.ssafy.meeting: DEBUG
