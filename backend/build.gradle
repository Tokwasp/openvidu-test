plugins {
    id 'java'
    id 'org.springframework.boot' version '3.4.1'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.ssafy'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-validation'

    // 세션(회원 식별) + 방 상태(projectId→roomName) 모두 Redis. MySQL 은 쓰지 않는다.
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'
    implementation 'org.springframework.session:spring-session-data-redis'

    // LiveKit server SDK — 토큰 서명 / Room / Egress 제어 (OpenVidu3 = 내부적으로 LiveKit)
    // 02-access-token.md §7 "livekit-server SDK가 서명까지 다 한다" → jjwt 불필요
    implementation 'io.livekit:livekit-server:0.8.1'
    // LiveKit SDK 는 protobuf 전체 런타임(GeneratedMessageV3)을 요구한다.
    // 빠지면 WebhookReceiver 로딩 시 NoClassDefFoundError 로 백엔드가 기동 실패한다.
    implementation 'com.google.protobuf:protobuf-java:3.25.5'

    // egress_ended 웹훅에서 녹음 후처리 메시지를 SQS 로 발행 (S3→SQS→워커)
    implementation platform('software.amazon.awssdk:bom:2.31.0')
    implementation 'software.amazon.awssdk:sqs'

    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    developmentOnly 'org.springframework.boot:spring-boot-devtools'
}
