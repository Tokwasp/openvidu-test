# OpenVidu3(LiveKit) 기반 회의 데모 — 백/프/미디어 스택 한 방에.
#   docker compose up --build   후 http://localhost:8081 접속.
#
# 흐름: 프론트(8081) → 백엔드(8080) → LiveKit(7880) ─┬─ Egress ─→ AWS S3
#                                                     └─ webhook → 백엔드
name: openvidu3-meeting

services:
  # ── 공용 인프라 ────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped

  # MySQL 제거됨 — 방 상태는 Redis(Upstash), 세션도 Redis. 회원 식별은 세션에서.
  # MinIO 제거됨 — 녹음은 Egress 가 우리 AWS S3 에 직접 업로드한다(.env 의 AWS_S3_*).

  # ── OpenVidu3(LiveKit) 미디어 서버 + Egress ──────
  livekit:
    image: livekit/livekit-server:latest
    command: --config /etc/livekit.yaml
    volumes:
      - ./infra/livekit/livekit.yaml:/etc/livekit.yaml:ro
    ports:
      # 시그널링(7880)은 caddy 가 wss://<도메인>/rtc 로 프록시하므로 localhost 에만 바인딩.
      - "127.0.0.1:7880:7880"          # WebRTC 시그널 (caddy → wss 로 감쌈)
      # 아래 둘은 브라우저가 직접 미디어를 주고받는 포트라 공인망에 열어야 한다.
      - "7881:7881"                    # RTC over TCP (ICE 폴백)
      - "50000-50060:50000-50060/udp"  # RTC 미디어
    depends_on:
      - redis
    restart: unless-stopped

  egress:
    image: livekit/egress:latest
    environment:
      EGRESS_CONFIG_FILE: /etc/egress.yaml
    volumes:
      - ./infra/livekit/egress.yaml:/etc/egress.yaml:ro
    cap_add:
      - SYS_ADMIN                      # Egress 내부 Chrome 샌드박스에 필요
    depends_on:
      - redis
      - livekit
    restart: unless-stopped

  # ── 우리 애플리케이션 ───────────────────────────
  backend:
    build: ./backend
    environment:
      # 브라우저가 붙는 주소 — EC2 배포 시 ws://<EC2 공인IP>:7880 으로 바꾼다
      LIVEKIT_WS_URL: ${LIVEKIT_WS_URL:-ws://localhost:7880}
      LIVEKIT_HOST: http://livekit:7880
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:-devkey}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:-secretsecretsecretsecret}
      # 녹음 저장 = 우리 AWS S3 (Egress 가 직접 업로드). 반드시 채운다.
      AWS_S3_BUCKET: ${AWS_S3_BUCKET:-}
      AWS_S3_REGION: ${AWS_S3_REGION:-ap-northeast-2}
      AWS_S3_ACCESS_KEY: ${AWS_S3_ACCESS_KEY:-}
      AWS_S3_SECRET_KEY: ${AWS_S3_SECRET_KEY:-}
      # 녹음 후처리 큐 (egress_ended → 발행). 비우면 발행 생략.
      # 단체(MIXED) 믹스 큐 / 개인(PARTICIPANT) 음성 큐. 개인 큐 비우면 개인도 단체 큐로 발행.
      AWS_SQS_QUEUE_URL: ${AWS_SQS_QUEUE_URL:-}
      AWS_SQS_PERSONAL_QUEUE_URL: ${AWS_SQS_PERSONAL_QUEUE_URL:-}
      # 모놀리식과 공유하는 Upstash Redis 세션 (02 §7). 반드시 채워야 기동된다.
      UPSTASH_REDIS_HOST: ${UPSTASH_REDIS_HOST:-}
      UPSTASH_REDIS_PORT: ${UPSTASH_REDIS_PORT:-6379}
      UPSTASH_REDIS_PASSWORD: ${UPSTASH_REDIS_PASSWORD:-}
      UPSTASH_REDIS_SSL: ${UPSTASH_REDIS_SSL:-true}
      # 개발용 세션 우회 — true 면 세션 없이 쿼리 memberId 로 참여(단독 테스트). 운영 false!
      MEETING_DEV_AUTH_BYPASS: ${MEETING_DEV_AUTH_BYPASS:-false}
    ports:
      - "127.0.0.1:8080:8080"   # 프론트(nginx) 컨테이너가 /api 를 프록시. 외부 직접 노출 안 함
    depends_on:
      livekit:
        condition: service_started
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    ports:
      # caddy 는 도커 네트워크(frontend:80)로 접근하므로 이 포트는 직접 접근(SSH 터널)용.
      # 공인망에 열 필요 없어 127.0.0.1 에만 바인딩한다.
      - "127.0.0.1:8081:80"
    depends_on:
      - backend
    restart: unless-stopped

  # ── HTTPS 리버스 프록시 (도메인 접속용) ─────────────
  # foodshare.click 같은 도메인으로 접속할 때만 사용.
  #   - Let's Encrypt 인증서 자동 발급/갱신
  #   - https://DOMAIN            → 프론트(UI + /api)
  #   - wss://DOMAIN/rtc          → LiveKit 시그널(신호)
  # 미디어(UDP)는 caddy를 거치지 않고 EC2로 직접 흐른다.
  # DOMAIN 이 비어 있으면(로컬/IP 테스트) 이 서비스는 caddy 프로필로 꺼둘 수 있다.
  caddy:
    image: caddy:2-alpine
    profiles: ["proxy"]              # 도메인 접속 시에만: docker compose --profile proxy up -d
    environment:
      DOMAIN: ${DOMAIN:-}
      ACME_EMAIL: ${ACME_EMAIL:-}
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - frontend
      - livekit
    restart: unless-stopped

volumes:
  caddy-data:
  caddy-config:
