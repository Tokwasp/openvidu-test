# OpenVidu3(LiveKit) 기반 회의 데모 — 백/프/미디어 스택 한 방에.
#   docker compose up --build   후 http://localhost:8081 접속.
#
# 흐름: 프론트(8081) → 백엔드(8080) → LiveKit(7880) ─┬─ Egress ─→ MinIO(9000)
#                                                     └─ webhook → 백엔드
name: openvidu3-meeting

services:
  # ── 공용 인프라 ────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped

  mysql:
    image: mysql:8.0
    # 작은 EC2(메모리 빠듯)에서도 뜨도록 메모리 사용을 줄인다
    command: >
      --innodb-buffer-pool-size=64M
      --performance-schema=OFF
      --innodb-flush-method=O_DIRECT
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: meeting
      MYSQL_USER: meeting
      MYSQL_PASSWORD: meeting
    volumes:
      - mysql-data:/var/lib/mysql   # 익명 볼륨 대신 관리되는 named 볼륨
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 60s             # 첫 초기화 동안 healthcheck 실패로 안 죽게 여유
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    ports:
      - "9000:9000"   # S3 API — 녹음 확인용
      - "9001:9001"   # 웹 콘솔 — 브라우저로 파일이 쌓이는지 눈으로 확인
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  # 스크래치 버킷 생성(한 번만 실행되고 종료)
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ACCESS_KEY:-minioadmin} ${MINIO_SECRET_KEY:-minioadmin} &&
      mc mb -p local/${MINIO_BUCKET:-recordings} || true &&
      echo 'bucket ready';
      "

  # ── OpenVidu3(LiveKit) 미디어 서버 + Egress ──────
  livekit:
    image: livekit/livekit-server:latest
    command: --config /etc/livekit.yaml
    volumes:
      - ./infra/livekit/livekit.yaml:/etc/livekit.yaml:ro
    ports:
      - "7880:7880"                    # WebRTC 시그널 (브라우저가 붙는 곳)
      - "7881:7881"                    # RTC over TCP
      - "50000-50060:50000-50060/udp"  # RTC 미디어
    depends_on:
      - redis
    restart: unless-stopped

  egress:
    image: livekit/egress:latest
    environment:
      EGRESS_CONFIG_FILE: /etc/egress.yaml
    volumes:
      - ./infra/livekit/egress.yaml:/etc/egress.yaml:ro
    cap_add:
      - SYS_ADMIN                      # Egress 내부 Chrome 샌드박스에 필요
    depends_on:
      - redis
      - livekit
    restart: unless-stopped

  # ── 우리 애플리케이션 ───────────────────────────
  backend:
    build: ./backend
    environment:
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_NAME: meeting
      DB_USER: meeting
      DB_PASSWORD: meeting
      # 브라우저가 붙는 주소 — EC2 배포 시 ws://<EC2 공인IP>:7880 으로 바꾼다
      LIVEKIT_WS_URL: ${LIVEKIT_WS_URL:-ws://localhost:7880}
      LIVEKIT_HOST: http://livekit:7880
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:-devkey}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:-secretsecretsecretsecret}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      MINIO_BUCKET: ${MINIO_BUCKET:-recordings}
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
      livekit:
        condition: service_started
      minio:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    ports:
      - "8081:80"                    # 직접 접근용(http). 도메인 접속은 caddy(443)로.
    depends_on:
      - backend
    restart: unless-stopped

  # ── HTTPS 리버스 프록시 (도메인 접속용) ─────────────
  # foodshare.click 같은 도메인으로 접속할 때만 사용.
  #   - Let's Encrypt 인증서 자동 발급/갱신
  #   - https://DOMAIN            → 프론트(UI + /api)
  #   - wss://DOMAIN/rtc          → LiveKit 시그널(신호)
  # 미디어(UDP)는 caddy를 거치지 않고 EC2로 직접 흐른다.
  # DOMAIN 이 비어 있으면(로컬/IP 테스트) 이 서비스는 caddy 프로필로 꺼둘 수 있다.
  caddy:
    image: caddy:2-alpine
    profiles: ["proxy"]              # 도메인 접속 시에만: docker compose --profile proxy up -d
    environment:
      DOMAIN: ${DOMAIN:-}
      ACME_EMAIL: ${ACME_EMAIL:-}
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - frontend
      - livekit
    restart: unless-stopped

volumes:
  mysql-data:
  caddy-data:
  caddy-config:
