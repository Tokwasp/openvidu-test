# LiveKit 서버 설정 (OpenVidu3 코어). 데모/EC2 로컬용.
port: 7880
bind_addresses:
  - ""            # 모든 인터페이스

rtc:
  tcp_port: 7881
  # WebRTC 미디어 UDP 포트 범위 (docker-compose 에서 열어줌)
  port_range_start: 50000
  port_range_end: 50060
  # 공인망(EC2 등)에서 브라우저가 미디어를 받으려면 반드시 true.
  # false 면 사설 IP 만 ICE 후보로 광고돼 서버→브라우저 오디오가 도착하지 않는다
  # (발행/녹음은 되지만 상대 목소리가 안 들림). true 면 STUN 으로 공인 IP 를
  # 탐지해 후보로 광고하고, 호스트 후보도 함께 나가 로컬 테스트도 유지된다.
  # 고정 IP 를 알면 대신 node_ip: <공인 IP> 를 명시해도 된다.
  use_external_ip: true

redis:
  address: redis:6379         # Egress 와 메시지 버스를 공유

keys:
  # ⚠️ 데모 키. 운영에선 반드시 교체. .env / application.yml 과 일치해야 한다.
  devkey: secretsecretsecretsecret

# 회의방 기본 타임아웃 (01-room-lifecycle.md §4)
room:
  empty_timeout: 120          # 아무도 안 들어온 방: 2분
  departure_timeout: 1        # 마지막 한 명이 나간 뒤: 거의 즉시 닫아 mixed 녹음 마감(0=기본값 폴백이라 1 사용)
  auto_create: false          # 반드시 백엔드 createRoom 으로만 생성

# 웹훅: 이벤트를 우리 백엔드로 쏜다 (04 §5-1)
webhook:
  api_key: devkey             # 이 키로 웹훅 JWT 를 서명 → 백엔드가 검증
  urls:
    - http://backend:8080/api/livekit/webhook
